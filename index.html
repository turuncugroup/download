<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSaveApp - Video & MP3 İndirici</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 10px;
        }

        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            margin: auto;
        }

        .container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            z-index: 2;
        }

        header { margin-bottom: 30px; }
        .logo { font-size: 2.5rem; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.6); }
        .subtitle { color: #94a3b8; margin-top: 10px; font-size: 0.95rem; }

        .search-box { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        input[type="text"] {
            width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #334155;
            background-color: #0f172a; color: #fff; font-size: 1rem; outline: none; transition: 0.3s;
        }
        input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        button { cursor: pointer; font-weight: 600; transition: 0.3s; border: none; }
        #btnFetch { background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; padding: 15px; border-radius: 8px; font-size: 1.1rem; }
        #btnFetch:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }

        .download-options { background: #0f172a; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px dashed #38bdf8; }
        .download-options h3 { font-size: 1.1rem; margin-bottom: 15px; color: #38bdf8; }
        .button-group { display: flex; gap: 10px; }
        .btn-download { flex: 1; padding: 12px; border-radius: 8px; color: white; font-size: 0.95rem; text-align: center; }
        .mp3 { background-color: #10b981; } .mp3:hover { background-color: #059669; }
        .mp4 { background-color: #f43f5e; } .mp4:hover { background-color: #e11d48; }

        .extra-reward { margin-top: 20px; padding-top: 20px; border-top: 1px solid #334155; }
        .extra-reward p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
        .btn-reward { background-color: #eab308; color: #0f172a; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; }
        .btn-reward:hover { background-color: #ca8a04; }

        .banner-ad {
            width: 100%; max-width: 728px; height: 90px; background-color: #1e293b;
            border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
            color: #64748b; font-size: 0.85rem; border-radius: 8px; margin: 10px 0; overflow: hidden;
        }

        .side-ad {
            width: 160px; height: 600px; background-color: #1e293b;
            border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
            color: #64748b; font-size: 0.85rem; border-radius: 8px; text-align: center; padding: 10px; overflow: hidden;
        }

        .hidden { display: none; }

        @media (max-width: 900px) {
            .side-ad { display: none; }
            .button-group { flex-direction: column; }
            .banner-ad { height: 60px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- REKLAM: ÜST BANNER -->
    <div class="banner-ad top-ad">
        <span>SABİT ÜST REKLAM ALANI (Gelecekte AdSense)</span>
    </div>

    <div class="main-wrapper">
        
        <!-- REKLAM: SOL DİKEY -->
        <div class="side-ad left-ad">
            <span>SOL DİKEY REKLAM (160x600)</span>
        </div>

        <!-- ANA UYGULAMA PANELİ -->
        <div class="container">
            <header>
                <h1 class="logo">Media<span>Save</span></h1>
                <p class="subtitle">Sosyal medya linkini yapıştır, anında MP3 veya MP4 olarak indir!</p>
            </header>

            <div class="search-box">
                <input type="text" id="videoLink" placeholder="YouTube, TikTok, Instagram veya FB linkini yapıştırın...">
                <button id="btnFetch" onclick="startDownloadProcess()">Linki Çöz</button>
            </div>

            <div id="downloadOptions" class="download-options hidden">
                <h3>Medya İndirmeye Hazır!</h3>
                <div class="button-group">
                    <button class="btn-download mp3" onclick="executeAction('mp3')">🎵 MP3 Olarak İndir (Ses)</button>
                    <button class="btn-download mp4" onclick="executeAction('mp4')">🎥 MP4 Olarak İndir (Video)</button>
                </div>
            </div>

            <div id="rewardArea" class="extra-reward hidden">
                <p>Hızlı indirme sunucularını kullanmak ister misiniz?</p>
                <button class="btn-reward" onclick="executeAction('premium')">⚡ Kısa Reklam İzle & Ultra Hızlı İndir</button>
            </div>
        </div>

        <!-- REKLAM: SAĞ DİKEY -->
        <div class="side-ad right-ad">
            <span>SAĞ DİKEY REKLAM (160x600)</span>
        </div>

    </div>

    <!-- REKLAM: ALT BANNER -->
    <div class="banner-ad bottom-ad">
        <span>SABİT ALT REKLAM ALANI (Gelecekte AdSense)</span>
    </div>

    <script>
        let globalUserLink = "";

        // Link doğrulama ve arayüz açma süreci
        function startDownloadProcess() {
            let link = document.getElementById('videoLink').value.trim();
            let fetchButton = document.getElementById('btnFetch');
            
            if(link === "") {
                alert("Lütfen geçerli bir bağlantı yapıştırın!");
                return;
            }

            fetchButton.innerText = "Bağlantı Doğrulanıyor...";
            fetchButton.disabled = true;
            globalUserLink = link;

            setTimeout(() => {
                document.getElementById('downloadOptions').classList.remove('hidden');
                document.getElementById('rewardArea').classList.remove('hidden');
                fetchButton.innerText = "Linki Çöz";
                fetchButton.disabled = false;
            }, 500);
        }

        // 👑 ÇAKIŞMALARI ÖNLENMİŞ REKLAM VE İNDİRME AKTİVASYONU
        function executeAction(type) {
            if(!globalUserLink) {
                alert("Lütfen önce bir link çözün!");
                return;
            }

            // 1. ADIM: Adsterra Reklam ağını temiz bir yeni sekmede güvenle aç (Dolar kazandırır)
            window.open("https://profitableratecpmnetwork.com", "_blank");

            // 2. ADIM: Mevcut ana sekmeyi anında engelsiz çalışan gerçek indirme sayfasına dönüştür
            // Bu sayede tarayıcılar block veya yönlendirme hatası veremez.
            window.location.href = "https://cobalt.tools/?url=" + encodeURIComponent(globalUserLink);
        }
    </script>

</body>
</html>
