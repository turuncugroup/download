<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSaveApp - Video & MP3 İndirici</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SABİT REKLAM ALANI (ÜST BANNER) -->
    <div class="banner-ad top-ad">
        <span>Reklam Alanı (Google AdSense / AdMob Banner)</span>
    </div>

    <div class="container">
        <header>
            <h1 class="logo">Media<span>Save</span></h1>
            <p class="subtitle">Sosyal medya linkini yapıştır, anında MP3 veya MP4 olarak indir!</p>
        </header>

        <!-- BAĞLANTI GİRİŞ ALANI -->
        <div class="search-box">
            <input type="text" id="videoLink" placeholder="Video veya ses linkini buraya yapıştırın...">
            <button id="btnFetch" onclick="startDownloadProcess()">Linki Çöz</button>
        </div>

        <!-- İNDİRME SEÇENEKLERİ (LİNK ÇÖZÜLDÜKTEN SONRA AÇILACAK) -->
        <div id="downloadOptions" class="download-options hidden">
            <h3>Medya Başarıyla Çözüldü!</h3>
            <div class="button-group">
                <button class="btn-download mp3" onclick="triggerAdAndDownload('mp3')">🎵 MP3 Olarak İndir (Ses)</button>
                <button class="btn-download mp4" onclick="triggerAdAndDownload('mp4')">🎥 MP4 Olarak İndir (Video)</button>
            </div>
        </div>

        <!-- UZUN REKLAM İLE EXTRA AVANTAJ (İSTEDİĞİNİZ ÖDÜLLÜ REKLAM KURGUSU) -->
        <div class="extra-reward">
            <p>Hızlı indirme sunucularını kullanmak ister misiniz?</p>
            <button class="btn-reward" onclick="showRewardedAd()">⚡ Kısa Reklam İzle & Ultra Hızlı İndir</button>
        </div>
    </div>

    <!-- SABİT REKLAM ALANI (ALT BANNER) -->
    <div class="banner-ad bottom-ad">
        <span>Reklam Alanı (Google AdSense / AdMob Banner)</span>
    </div>

    <script>
        // Genel İndirme Motoru Ayarları
const apiKey = "4e0bbdca6amshf08532fa2517b64p114dc8jsnd374839d887a";

let downloadedMp3Url = "";
let downloadedMp4Url = "";

async function startDownloadProcess() {
    let link = document.getElementById('videoLink').value.trim();
    let fetchButton = document.getElementById('btnFetch');
    
    if(link === "") {
        alert("Lütfen geçerli bir sosyal medya (YouTube, Instagram, FB) linki yapıştırın!");
        return;
    }

    fetchButton.innerText = "Bağlantı Çözülüyor...";
    fetchButton.disabled = true;

    // Linkin hangi platforma ait olduğunu otomatik algılayan dinamik API yönlendirici sistem
    let apiHost = "";
    let apiUrl = "";

    if (link.includes("youtube.com") || link.includes("youtu.be")) {
        // YouTube İndirme Alt Sunucusu
        apiHost = "youtube-video-and-shorts-downloader1.p.rapidapi.com";
        apiUrl = `https://${apiHost}/display?url=${encodeURIComponent(link)}`;
    } else if (link.includes("instagram.com")) {
        // Instagram İndirme Alt Sunucusu
        apiHost = "instagram-downloader-download-instagram-videos-stories.p.rapidapi.com";
        apiUrl = `https://${apiHost}/index?url=${encodeURIComponent(link)}`;
    } else {
        // Facebook ve Diğer Platformlar için Mevcut Sunucumuz
        apiHost = "facebook-reel-and-video-downloader.p.rapidapi.com";
        apiUrl = `https://${apiHost}/app/main.php?url=${encodeURIComponent(link)}`;
    }

    const options = {
        method: 'GET',
        headers: {
            'x-rapidapi-key': apiKey,
            'x-rapidapi-host': apiHost
        }
    };

    try {
        const response = await fetch(apiUrl, options);
        
        if (!response.ok) {
            throw new Error(`Sunucu yanıt vermedi: ${response.status}`);
        }

        const result = await response.json();
        console.log("Gelen Medya Verisi:", result);

        // Farklı sunuculardan gelen esnek veri formatlarını yakalayan gelişmiş filtreleme
        downloadedMp4Url = result.url || result.download_url || result.link || (result.links && result.links[0]) || result.result;
        downloadedMp3Url = result.mp3 || result.audio || result.audio_url || downloadedMp4Url; // MP3 yoksa videoya yönlendirir

        if (downloadedMp4Url && downloadedMp4Url.startsWith("http")) {
            // Başarılıysa indirme seçenekleri kartını ekranda göster
            document.getElementById('downloadOptions').classList.remove('hidden');
        } else {
            alert("Bağlantı analiz edilemedi. Lütfen linkin herkese açık ve doğru olduğundan emin olun.");
        }

    } catch (error) {
        console.error("Teknik Detay:", error);
        alert("Bağlantı kurulurken teknik bir sorun oluştu. Bu platform için API paketiniz ücretsiz olarak güncelleniyor olabilir, lütfen az sonra tekrar deneyin.");
    } finally {
        fetchButton.innerText = "Linki Çöz";
        fetchButton.disabled = false;
    }
}

function triggerAdAndDownload(format) {
    // Para kazandıracak geçiş reklam kurgusu (Gelecekte buraya reklam scripti eklenecek)
    alert("Geçiş Reklamı Tetiklendi! Reklam bittikten sonra " + format.toUpperCase() + " indirme işleminiz başlayacaktır.");
    
    let targetUrl = (format === 'mp3') ? downloadedMp3Url : downloadedMp4Url;
    
    if(targetUrl) {
        window.open(targetUrl, '_blank');
    } else {
        alert("İndirme bağlantısı bulunamadı.");
    }
}

function showRewardedAd() {
    alert("Ödüllü Reklam Başlatıldı! 15 saniye sonra yüksek hızlı sunucu linkiniz aktif olacaktır.");
}

    </script>
</body>
</html>
