<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSaveApp - Video & MP3 İndirici</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SABİT REKLAM ALANI (ÜST BANNER) -->
    <div class="banner-ad top-ad">
        <span>Reklam Alanı (Google AdSense / AdMob Banner)</span>
    </div>

    <div class="container">
        <header>
            <h1 class="logo">Media<span>Save</span></h1>
            <p class="subtitle">Sosyal medya linkini yapıştır, anında MP3 veya MP4 olarak indir!</p>
        </header>

        <!-- BAĞLANTI GİRİŞ ALANI -->
        <div class="search-box">
            <input type="text" id="videoLink" placeholder="Video veya ses linkini buraya yapıştırın...">
            <button id="btnFetch" onclick="startDownloadProcess()">Linki Çöz</button>
        </div>

        <!-- İNDİRME SEÇENEKLERİ (LİNK ÇÖZÜLDÜKTEN SONRA AÇILACAK) -->
        <div id="downloadOptions" class="download-options hidden">
            <h3>Medya Başarıyla Çözüldü!</h3>
            <div class="button-group">
                <button class="btn-download mp3" onclick="triggerAdAndDownload('mp3')">🎵 MP3 Olarak İndir (Ses)</button>
                <button class="btn-download mp4" onclick="triggerAdAndDownload('mp4')">🎥 MP4 Olarak İndir (Video)</button>
            </div>
        </div>

        <!-- UZUN REKLAM İLE EXTRA AVANTAJ (İSTEDİĞİNİZ ÖDÜLLÜ REKLAM KURGUSU) -->
        <div class="extra-reward">
            <p>Hızlı indirme sunucularını kullanmak ister misiniz?</p>
            <button class="btn-reward" onclick="showRewardedAd()">⚡ Kısa Reklam İzle & Ultra Hızlı İndir</button>
        </div>
    </div>

    <!-- SABİT REKLAM ALANI (ALT BANNER) -->
    <div class="banner-ad bottom-ad">
        <span>Reklam Alanı (Google AdSense / AdMob Banner)</span>
    </div>

    <script>
        // RapidAPI Kimlik Bilgileri
const apiKey = "4e0bbdca6amshf08532fa2517b64p114dc8jsnd374839d887a";
const apiHost = "facebook-reel-and-video-downloader.p.rapidapi.com";

let downloadedVideoUrl = "";

async function startDownloadProcess() {
    let link = document.getElementById('videoLink').value;
    let fetchButton = document.getElementById('btnFetch');
    
    if(link.trim() === "") {
        alert("Lütfen geçerli bir bağlantı yapıştırın!");
        return;
    }

    // Arayüz kilitleme ve yükleniyor geri bildirimi
    fetchButton.innerText = "Bağlantı Çözülüyor...";
    fetchButton.disabled = true;

    // CORS engellerini aşmak ve doğrudan API sunucusuna güvenli bağlanmak için tam adres
    const url = `https://${apiHost}/app/main.php?url=${encodeURIComponent(link.trim())}`;
    
    const options = {
        method: 'GET',
        headers: {
            'x-rapidapi-key': apiKey,
            'x-rapidapi-host': apiHost
        }
    };

    try {
        const response = await fetch(url, options);
        
        if (!response.ok) {
            throw new Error(`Sunucu hatası: ${response.status}`);
        }

        const result = await response.json();
        console.log("API Gelen Veri Yapısı:", result); // Hata ayıklama için konsola yazdırıyoruz

        // API'nin dönebileceği tüm olası nesne isimlerini tek tek kontrol ediyoruz (Esnek Yapı)
        if (result) {
            downloadedVideoUrl = result.url || 
                                 result.download_url || 
                                 result.link || 
                                 (result.links && result.links[0]) ||
                                 (result.data && result.data.url) ||
                                 result.result;
        }
        
        // Eğer yukarıdaki taramalardan en az biri başarılı olduysa indirme butonunu aç
        if (downloadedVideoUrl && downloadedVideoUrl.startsWith("http")) {
            document.getElementById('downloadOptions').classList.remove('hidden');
        } else {
            // Eğer API hata mesajı döndüyse kullanıcıya göster
            let errorMsg = result.message || result.error || "Video çözülemedi. Bağlantının herkese açık ve geçerli olduğundan emin olun.";
            alert(errorMsg);
        }

    } catch (error) {
        console.error("Hata Detayı:", error);
        alert("Bağlantı kurulurken bir sorun oluştu. Lütfen tarayıcınızın konsol (F12) ekranındaki hatayı kontrol edin.");
    } finally {
        // Butonu eski haline getir
        fetchButton.innerText = "Linki Çöz";
        fetchButton.disabled = false;
    }
}

function triggerAdAndDownload(format) {
    // Sektör standardı reklam kurgusu tetikleyicisi
    alert("Geçiş Reklamı Tetiklendi! Reklam bittikten sonra " + format.toUpperCase() + " indirme sekmesine yönlendirileceksiniz.");
    
    if(downloadedVideoUrl) {
        // İndirme bağlantısını güvenli bir şekilde yeni sekmede açar
        window.open(downloadedVideoUrl, '_blank');
    } else {
        alert("İndirme bağlantısı kayboldu, lütfen sayfayı yenileyip tekrar deneyin.");
    }
}

function showRewardedAd() {
    alert("Ödüllü Reklam Başlatıldı! 15 saniye sonra yüksek hızlı premium sunucu aktif olacak.");
}

    </script>
</body>
</html>
