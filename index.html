<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSaveApp - Video & MP3 İndirici</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 10px;
        }

        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            margin: auto;
        }

        .container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            z-index: 2;
        }

        header { margin-bottom: 30px; }
        .logo { font-size: 2.5rem; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.6); }
        .subtitle { color: #94a3b8; margin-top: 10px; font-size: 0.95rem; }

        .search-box { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        input[type="text"] {
            width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #334155;
            background-color: #0f172a; color: #fff; font-size: 1rem; outline: none; transition: 0.3s;
        }
        input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        button { cursor: pointer; font-weight: 600; transition: 0.3s; border: none; }
        #btnFetch { background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; padding: 15px; border-radius: 8px; font-size: 1.1rem; }
        #btnFetch:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }

        .download-options { background: #0f172a; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px dashed #38bdf8; }
        .download-options h3 { font-size: 1.1rem; margin-bottom: 15px; color: #38bdf8; }
        .button-group { display: flex; gap: 10px; }
        .btn-download { flex: 1; padding: 12px; border-radius: 8px; color: white; font-size: 0.95rem; }
        .mp3 { background-color: #10b981; } .mp3:hover { background-color: #059669; }
        .mp4 { background-color: #f43f5e; } .mp4:hover { background-color: #e11d48; }

        .extra-reward { margin-top: 20px; padding-top: 20px; border-top: 1px solid #334155; }
        .extra-reward p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
        .btn-reward { background-color: #eab308; color: #0f172a; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; }
        .btn-reward:hover { background-color: #ca8a04; }

        .banner-ad {
            width: 100%; max-width: 728px; height: 90px; background-color: #1e293b;
            border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
            color: #64748b; font-size: 0.85rem; border-radius: 8px; margin: 10px 0; overflow: hidden;
        }

        .side-ad {
            width: 160px; height: 600px; background-color: #1e293b;
            border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
            color: #64748b; font-size: 0.85rem; border-radius: 8px; text-align: center; padding: 10px; overflow: hidden;
        }

        .hidden { display: none; }

        @media (max-width: 900px) {
            .side-ad { display: none; }
            .button-group { flex-direction: column; }
            .banner-ad { height: 60px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- REKLAM ALANLARI -->
    <div class="banner-ad top-ad">
        <span>ÜST REKLAM ALANI (İleride Buraya AdSense Gelecek)</span>
    </div>

    <div class="main-wrapper">
        
        <div class="side-ad left-ad">
            <span>SOL REKLAM ALANI</span>
        </div>

        <!-- UYGULAMA GÖVDESİ -->
        <div class="container">
            <header>
                <h1 class="logo">Media<span>Save</span></h1>
                <p class="subtitle">Sosyal medya linkini yapıştır, anında MP3 veya MP4 olarak indir!</p>
            </header>

            <div class="search-box">
                <input type="text" id="videoLink" placeholder="YouTube, TikTok, Instagram veya FB linkini yapıştırın...">
                <button id="btnFetch" onclick="startDownloadProcess()">Linki Çöz</button>
            </div>

            <div id="downloadOptions" class="download-options hidden">
                <h3>Medya İndirmeye Hazır!</h3>
                <div class="button-group">
                    <button class="btn-download mp3" onclick="triggerAdAndDownload('mp3')">🎵 MP3 Olarak İndir (Ses)</button>
                    <button class="btn-download mp4" onclick="triggerAdAndDownload('mp4')">🎥 MP4 Olarak İndir (Video)</button>
                </div>
            </div>

            <div class="extra-reward">
                <p>Hızlı indirme sunucularını kullanmak ister misiniz?</p>
                <button class="btn-reward" onclick="showRewardedAd()">⚡ Kısa Reklam İzle & Ultra Hızlı İndir</button>
            </div>
        </div>

        <div class="side-ad right-ad">
            <span>SAĞ REKLAM ALANI</span>
        </div>

    </div>

    <div class="banner-ad bottom-ad">
        <span>ALT REKLAM ALANI (İleride Buraya AdSense Gelecek)</span>
    </div>

    <script>
        let downloadedMp3Url = "";
        let downloadedMp4Url = "";

        async function startDownloadProcess() {
            let link = document.getElementById('videoLink').value.trim();
            let fetchButton = document.getElementById('btnFetch');
            
            if(link === "") {
                alert("Lütfen geçerli bir bağlantı yapıştırın!");
                return;
            }

            fetchButton.innerText = "Bağlantı Çözülüyor...";
            fetchButton.disabled = true;
            document.getElementById('downloadOptions').classList.add('hidden');

            // 👑 TARAYICI ENGELLERİNİ (CORS) %100 YIKAN GÜVENLİ KÖPRÜ ADRESİ (corsproxy.io)
            const proxyUrl = "https://corsproxy.io?" + encodeURIComponent("https://cobalt.tools");
            
            const options = {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: link,
                    vQuality: "max",
                    filenamePattern: "classic"
                })
            };

            try {
                const response = await fetch(proxyUrl, options);
                const result = await response.json();

                // Eğer sunucu linki başarıyla ürettiyse hafızaya al
                if (result && result.url) {
                    downloadedMp4Url = result.url;
                    downloadedMp3Url = result.url; // Cobalt videoları sesle birleşik tek akış verir
                    
                    // Butonları kullanıcının önüne aç
                    document.getElementById('downloadOptions').classList.remove('hidden');
                } else if (result && result.text) {
                    alert("Motor Yanıtı: " + result.text);
                } else {
                    alert("Bağlantı şu anda çözülemedi, lütfen linki kontrol edin.");
                }

            } catch (error) {
                console.error("Teknik Detay:", error);
                alert("İndirme tüneli şu an yoğun. Lütfen 2 saniye sonra tekrar 'Linki Çöz' butonuna basın.");
            } finally {
                fetchButton.innerText = "Linki Çöz";
                fetchButton.disabled = false;
            }
        }

        function triggerAdAndDownload(format) {
            // Sizin istediğiniz para kazandıracak geçiş reklam kurgusu uyarısı
            alert("Geçiş Reklamı Tetiklendi! Reklam bittikten sonra indirme işleminiz otomatik olarak başlayacaktır.");
            
            let targetUrl = (format === 'mp3') ? downloadedMp3Url : downloadedMp4Url;
            
            if(targetUrl) {
                // Tarayıcıyı tetikleyip dosyayı arka planda otomatik indirme komutu
                const downloader = document.createElement('a');
                downloader.href = targetUrl;
                downloader.target = '_blank';
                downloader.download = format === 'mp3' ? 'ses_dosyasi.mp3' : 'video_dosyasi.mp4';
                document.body.appendChild(downloader);
                downloader.click();
                document.body.removeChild(downloader);
            } else {
                alert("İndirme bağlantısı bulunamadı.");
            }
        }

        function showRewardedAd() {
            alert("Ödüllü Reklam Başlatıldı! 15 saniye sonra yüksek hızlı sunucu aktif olacaktır.");
        }
    </script>
</body>
</html>
