<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSaveApp - Video & MP3 İndirici</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SABİT REKLAM ALANI (ÜST BANNER) -->
    <div class="banner-ad top-ad">
        <span>Reklam Alanı (Google AdSense Banner)</span>
    </div>

    <div class="container">
        <header>
            <h1 class="logo">Media<span>Save</span></h1>
            <p class="subtitle">Sosyal medya linkini yapıştır, anında MP3 veya MP4 olarak indir!</p>
        </header>

        <!-- BAĞLANTI GİRİŞ ALANI -->
        <div class="search-box">
            <input type="text" id="videoLink" placeholder="YouTube, TikTok, Instagram veya Facebook linkini yapıştırın...">
            <button id="btnFetch" onclick="startDownloadProcess()">Linki Çöz</button>
        </div>

        <!-- İNDİRME SEÇENEKLERİ (LİNK KONTROL EDİLDİKTEN SONRA AÇILIR) -->
        <div id="downloadOptions" class="download-options hidden">
            <h3>Medya İndirmeye Hazır!</h3>
            <div class="button-group">
                <button class="btn-download mp3" onclick="triggerAdAndDownload('mp3')">🎵 MP3 Olarak İndir (Ses)</button>
                <button class="btn-download mp4" onclick="triggerAdAndDownload('mp4')">🎥 MP4 Olarak İndir (Video)</button>
            </div>
        </div>

        <!-- UZUN REKLAM İLE EXTRA AVANTAJ (ÖDÜLLÜ REKLAM KURGUSU) -->
        <div class="extra-reward">
            <p>Hızlı indirme sunucularını kullanmak ister misiniz?</p>
            <button class="btn-reward" onclick="showRewardedAd()">⚡ Kısa Reklam İzle & Ultra Hızlı İndir</button>
        </div>
    </div>

    <!-- SABİT REKLAM ALANI (ALT BANNER) -->
    <div class="banner-ad bottom-ad">
        <span>Reklam Alanı (Google AdSense Banner)</span>
    </div>

    <script>
        let globalUserLink = "";

        function startDownloadProcess() {
            let link = document.getElementById('videoLink').value.trim();
            let fetchButton = document.getElementById('btnFetch');
            
            if(link === "") {
                alert("Lütfen geçerli bir bağlantı yapıştırın!");
                return;
            }

            fetchButton.innerText = "Kontrol Ediliyor...";
            fetchButton.disabled = true;

            // Linki hafızaya alıp tarayıcı engellerini aşarak doğrudan indirme butonlarını açıyoruz
            globalUserLink = link;

            setTimeout(() => {
                document.getElementById('downloadOptions').classList.remove('hidden');
                fetchButton.innerText = "Linki Çöz";
                fetchButton.disabled = false;
            }, 800); // Kullanıcıya işlem yapılıyor hissi veren akıcı gecikme
        }

        function triggerAdAndDownload(format) {
            if(!globalUserLink) {
                alert("Lütfen önce bir link çözün!");
                return;
            }

            // Sizin istediğiniz para kazandıracak geçiş reklam kurgusu tetikleyicisi
            alert("Geçiş Reklamı Tetiklendi! Reklam bittikten sonra indirme penceresi açılacaktır.");
            
            // Dünya genelinde tarayıcı engeli olmayan evrensel yönlendirme köprüsü
            let targetUrl = "";
            
            if(format === 'mp3') {
                // Sesi ayıklayarak fırlatan köprü
                targetUrl = `https://cobalt.tools{globalUserLink}`;
            } else {
                // Videoyu doğrudan fırlatan köprü
                targetUrl = `https://cobalt.tools{globalUserLink}`;
            }
            
            // Yeni sekmede engelsiz açma komutu
            window.open(targetUrl, '_blank');
        }

        function showRewardedAd() {
            alert("Ödüllü Reklam Başlatıldı! 15 saniye reklam izledikten sonra yüksek hızlı sunucu aktif olacaktır.");
        }
    </script>
</body>
</html>
