<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSaveApp - Video & MP3 İndirici</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SABİT REKLAM ALANI (ÜST BANNER) -->
    <div class="banner-ad top-ad">
        <span>Reklam Alanı (Google AdSense / AdMob Banner)</span>
    </div>

    <div class="container">
        <header>
            <h1 class="logo">Media<span>Save</span></h1>
            <p class="subtitle">Sosyal medya linkini yapıştır, anında MP3 veya MP4 olarak indir!</p>
        </header>

        <!-- BAĞLANTI GİRİŞ ALANI -->
        <div class="search-box">
            <input type="text" id="videoLink" placeholder="YouTube, TikTok, Instagram veya FB linkini yapıştırın...">
            <button id="btnFetch" onclick="startDownloadProcess()">Linki Çöz</button>
        </div>

        <!-- İNDİRME SEÇENEKLERİ (LİNK ÇÖZÜLDÜKTEN SONRA AÇILACAK) -->
        <div id="downloadOptions" class="download-options hidden">
            <h3>Medya Başarıyla Çözüldü!</h3>
            <div class="button-group">
                <button class="btn-download mp3" onclick="triggerAdAndDownload('mp3')">🎵 MP3 Olarak İndir (Ses)</button>
                <button class="btn-download mp4" onclick="triggerAdAndDownload('mp4')">🎥 MP4 Olarak İndir (Video)</button>
            </div>
        </div>

        <!-- UZUN REKLAM İLE EXTRA AVANTAJ (İSTEDİĞİNİZ ÖDÜLLÜ REKLAM KURGUSU) -->
        <div class="extra-reward">
            <p>Hızlı indirme sunucularını kullanmak ister misiniz?</p>
            <button class="btn-reward" onclick="showRewardedAd()">⚡ Kısa Reklam İzle & Ultra Hızlı İndir</button>
        </div>
    </div>

    <!-- SABİT REKLAM ALANI (ALT BANNER) -->
    <div class="banner-ad bottom-ad">
        <span>Reklam Alanı (Google AdSense / AdMob Banner)</span>
    </div>

    <script>
        // Sizin RapidAPI Kimlik Bilgileriniz Entegre Edildi
        const apiKey = "4e0bbdca6amshf08532fa2517b64p114dc8jsnd374839d887a";
        const apiHost = "://rapidapi.com";
        
        let downloadedMp3Url = "";
        let downloadedMp4Url = "";

        async function startDownloadProcess() {
            let link = document.getElementById('videoLink').value.trim();
            let fetchButton = document.getElementById('btnFetch');
            
            if(link === "") {
                alert("Lütfen geçerli bir bağlantı yapıştırın!");
                return;
            }

            fetchButton.innerText = "Bağlantı Çözülüyor...";
            fetchButton.disabled = true;
            document.getElementById('downloadOptions').classList.add('hidden');

            // API'nin POST istek adresi
            const url = `https://${apiHost}/v1/social/autolink`;
            
            // Bu yeni motor veriyi JSON gövdesinde (body) kabul eder
            const options = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-rapidapi-key': apiKey,
                    'x-rapidapi-host': apiHost
                },
                body: JSON.stringify({ url: link })
            };

            try {
                const response = await fetch(url, options);
                const result = await response.json();
                console.log("Sunucudan Gelen Veri:", result);

                // API veri şemasına göre video ve ses adreslerini yakalıyoruz
                // Manh'g API'si genellikle 'medias' dizisi veya direkt url nesneleri döner
                if (result && (result.url || result.medias || result.download_url)) {
                    
                    // Esnek veri eşleştirme katmanı
                    let mainVideo = result.url || result.download_url || (result.medias && result.medias[0] && result.medias[0].url);
                    let mainAudio = result.audio || result.audio_url || mainVideo;
                    
                    if (result.medias && Array.isArray(result.medias)) {
                        // Eğer çoklu kalite varsa en yükseğini seçmeye çalışıyoruz
                        let videoObj = result.medias.find(m => m.type === 'video' || m.extension === 'mp4');
                        let audioObj = result.medias.find(m => m.type === 'audio' || m.extension === 'mp3');
                        if (videoObj) mainVideo = videoObj.url;
                        if (audioObj) mainAudio = audioObj.url;
                    }

                    downloadedMp4Url = mainVideo;
                    downloadedMp3Url = mainAudio;

                    // Başarılı bağlantı bulunduysa buton kartını ekranda göster
                    if(downloadedMp4Url && downloadedMp4Url.startsWith("http")) {
                        document.getElementById('downloadOptions').classList.remove('hidden');
                    } else {
                        alert("Geçerli bir indirme adresi üretilemedi. Link gizli veya silinmiş olabilir.");
                    }
                } else {
                    alert("Bu link platform tarafından çözülemedi. Lütfen linki kontrol edin.");
                }

            } catch (error) {
                console.error("Teknik Hata:", error);
                alert("İndirme motoruyla bağlantı kurulamadı. Lütfen az sonra tekrar deneyin.");
            } finally {
                fetchButton.innerText = "Linki Çöz";
                fetchButton.disabled = false;
            }
        }

        function triggerAdAndDownload(format) {
            // Reklam stratejisi uyarısı
            alert("Geçiş Reklamı Tetiklendi! Reklam bittikten sonra indirme işleminiz otomatik olarak başlayacaktır.");
            
            let targetUrl = (format === 'mp3') ? downloadedMp3Url : downloadedMp4Url;
            
            if(targetUrl) {
                window.open(targetUrl, '_blank');
            } else {
                alert("İndirme bağlantısı bulunamadı.");
            }
        }

        function showRewardedAd() {
            alert("Ödüllü Reklam Başlatıldı! 15 saniye reklam izledikten sonra yüksek hızlı sunucu linkiniz aktif olacaktır.");
        }
    </script>
</body>
</html>
